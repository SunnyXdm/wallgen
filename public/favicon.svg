<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="r"><rect width="64" height="64" rx="14"/></clipPath>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1417"/>
      <stop offset="0.5" stop-color="#16323a"/>
      <stop offset="1" stop-color="#517d80"/>
    </linearGradient>
    <filter id="b" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <pattern id="d" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="3" width="1" height="4" fill="#000" opacity="0.35"/>
      <rect y="3" width="4" height="1" fill="#000" opacity="0.35"/>
    </pattern>
  </defs>
  <g clip-path="url(#r)">
    <rect width="64" height="64" fill="url(#g)"/>
    <ellipse cx="46" cy="30" rx="18" ry="13" fill="#3c6b70" opacity="0.8" filter="url(#b)"/>
    <ellipse cx="17" cy="52" rx="28" ry="20" fill="#a9bfbc" opacity="0.8" filter="url(#b)"/>
    <rect width="64" height="64" fill="url(#d)"/>
  </g>
</svg>
